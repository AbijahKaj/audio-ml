name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # OIDC trusted publishing: No token needed if configured on npmjs.com
          # Fallback to token if OIDC not configured (uncomment line below):
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        # OIDC trusted publishing is used automatically if configured on npmjs.com
        # No NODE_AUTH_TOKEN needed when using OIDC
        # If using token-based auth instead, uncomment the lines below:
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
