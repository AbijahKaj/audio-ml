# Publish `audio-ml` and `@audio-ml/asr` to npm (OIDC trusted publishing).
#
# Versioning model:
# - `audio-ml` is the release driver for git tags: tag `vX.Y.Z` must match the
#   `version` field in the root `package.json` at the tagged commit.
# - `@audio-ml/asr` uses its own `version` in `packages/asr/package.json`. Bump
#   it when the ASR package changes. If that version is already on npm, the
#   ASR publish step is skipped so an audio-ml-only release still succeeds.
#
# Manual runs (`workflow_dispatch`) publish whatever versions are in those files.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production  # Requires approval before publishing
    permissions:
      contents: write  # Required to create releases
      id-token: write  # Required for OIDC trusted publishing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Using OIDC for authentication (no token needed)

      - name: Enable Corepack (for Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Determine version and tag
        id: version-info
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            echo "Using tag: $TAG_NAME → version $VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v$VERSION"
            echo "Manual run: version from root package.json: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish audio-ml to npm
        run: npm publish --access public

      - name: Publish @audio-ml/asr to npm
        id: publish-asr
        working-directory: packages/asr
        run: |
          ASR_VER=$(node -p "require('./package.json').version")
          echo "asr_version=$ASR_VER" >> "$GITHUB_OUTPUT"
          set +e
          PUBLISHED=$(npm view "@audio-ml/asr@${ASR_VER}" version 2>/dev/null)
          set -e
          if [ "$PUBLISHED" = "$ASR_VER" ]; then
            echo "Skip: @audio-ml/asr@${ASR_VER} is already on npm."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            npm publish --access public
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag if it doesn't exist
        if: github.ref_type != 'tag'
        run: |
          TAG="${{ steps.version-info.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            echo "Creating tag $TAG after successful publish"
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version-info.outputs.tag }}
          ROOT_VER: ${{ steps.version-info.outputs.version }}
          ASR_VER: ${{ steps.publish-asr.outputs.asr_version }}
          ASR_SKIPPED: ${{ steps.publish-asr.outputs.skipped }}
        run: |
          printf -v ROOT_LINE 'Published `audio-ml@%s`' "$ROOT_VER"
          if [ "$ASR_SKIPPED" = "true" ]; then
            printf -v ASR_LINE 'Skipped `@audio-ml/asr` (version `%s` already on npm). Bump `packages/asr/package.json` to publish a new ASR release.' "$ASR_VER"
          else
            printf -v ASR_LINE 'Published `@audio-ml/asr@%s`' "$ASR_VER"
          fi
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "$(printf '%s\n\n%s' "$ROOT_LINE" "$ASR_LINE")"
