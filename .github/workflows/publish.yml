name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
        env:
          # For first publish, you need a token. After setting up OIDC, remove this.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Enable Corepack (for Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package
        run: yarn build

      - name: Publish to npm
        run: npm publish --access public
        # Token is set in setup-node step above
        # After first publish, set up OIDC trusted publishing on npmjs.com
        # Then remove NODE_AUTH_TOKEN from setup-node step
